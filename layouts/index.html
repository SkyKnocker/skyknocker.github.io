{{ define "main" }}
<div class="grid grid-cols-1 md:grid-cols-5 gap-2 sm py-2">
  <div class="col-span-2">
    <div class="bg-gray-300 dark:bg-darker drop-shadow-md p-2 rounded-t-lg">
      <div class="flex flex-col justify-center">
        {{ partial "profilePhoto" . }}
        <div class="px-2 text-center">{{ partial "social" . }}</div>
      </div>
    </div>
    {{ partial "footer" . }}
  </div>

  <div class="col-span-3 relative">
    {{ $found_expanded := false }}
    {{ range .Site.Params.accordion }}
    <div class="px-2">
      <h2 class="accordion {{- if and (.expand) (not $found_expanded) }} active {{- $found_expanded = true }} {{- end }}">
        {{ $current := index $.Site.Data .item }}
        <p onclick="expandAccordion(this)" style="cursor: pointer">
          <i class="{{ $current.icon }}"></i>
          {{ $current.title -}}
        </p>
      </h2>

      <div class="panel overflow-hidden px-2 ml-2" {{ if .panel_id }}id="{{ .panel_id }}"{{ end }}>
        <div>
          {{ partial (print "accordion/" .item) $ }}
        </div>
        
        <div style="text-align: center; margin: 30px 0;">
          <button onclick="window.location.reload();" 
                  style="padding: 6px 15px; cursor: pointer; border-radius: 15px; background-color: #f59e0b; color: #111; border: none; font-weight: 600; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.1s ease;">
            ✕ Close Section
          </button>
        </div>
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
